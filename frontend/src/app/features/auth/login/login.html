@let localErrorMessage = errorMessage();

<div class="min-h-screen bg-primary flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl px-8 py-8">
    <a [routerLink]="ROUTES.HOME" class="flex items-center gap-2 no-underline mb-2 justify-center">
      <app-icon name="logo" class="text-6xl" />
    </a>

    <h1 class="font-headline font-extrabold text-tertiary text-3xl mb-7 text-center">
      Iniciar sesión
    </h1>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-1.5">
        <label class="font-body font-semibold text-sm text-tertiary" for="email">
          Correo electrónico
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="font-body text-sm text-tertiary bg-white border-2 border-neutral/20 rounded-xl px-4 py-3 outline-none w-full transition-colors focus:border-secondary"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="font-body font-semibold text-sm text-tertiary" for="password">
          Contraseña
        </label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="font-body text-sm text-tertiary bg-white border-2 border-neutral/20 rounded-xl px-4 py-3 outline-none w-full transition-colors focus:border-secondary"
        />
      </div>

      <button
        type="submit"
        [disabled]="!loginForm.valid"
        class="font-body font-bold text-base text-white bg-primary rounded-xl py-3.5 w-full mt-2 border-0 cursor-pointer disabled:cursor-not-allowed disabled:bg-primary/70"
      >
        Iniciar sesión
      </button>
    </form>

    @if (localErrorMessage) {
      <p class="font-body text-sm text-red-400 text-center mt-4">
        {{ localErrorMessage }}
      </p>
    }

    <p class="font-body text-sm text-neutral text-center mt-10">
      ¿No tienes cuenta?
      <a [routerLink]="ROUTES.AUTH.SIGNUP" class="font-semibold text-secondary no-underline">
        Regístrate
      </a>
    </p>
  </div>
</div>
